name: self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: inspect main js
        run: |
          set -e
          BASE="https://dokorail-proxy.vercel.app"
          curl -sS -m 30 -o main.js "$BASE/assets/main-BS8b6Q1W.js"
          echo "size: $(wc -c < main.js) bytes"
          echo "=== feeds-related code ==="
          grep -oE '.{120}/api/feeds.{200}' main.js | head -5
          echo
          echo "=== header names near fetch ==="
          grep -oE '"[Xx]-[A-Za-z-]+"' main.js | sort -u | head -30
          echo
          echo "=== train-search / application requests ==="
          grep -oE '.{80}[Tt]rain-?[Ss]earch.{120}' main.js | head -5
          echo
          echo "=== 'Application requests' string location ==="
          grep -oE '.{60}[Aa]pplication requests.{60}' main.js | head -3
