name: self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe direct function
        run: |
          set -e
          BASE="https://dokorail-proxy.vercel.app"
          echo "== direct /api/proxy =="
          curl -sS -m 20 -D - "$BASE/api/proxy" | head -20
          echo
          echo "== root (no rewrite now, expect 404) =="
          curl -sS -m 20 -o /dev/null -w "http %{http_code}\n" "$BASE/"
