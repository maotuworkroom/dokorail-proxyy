name: self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump root html
        run: |
          set -e
          BASE="https://dokorail-proxy.vercel.app"
          curl -sS -m 20 -o root.html "$BASE/"
          echo "=== script tags ==="
          grep -oE '<script[^>]*src="[^"]*"' root.html
          echo
          echo "=== inline JS mentioning feeds/train-search/api ==="
          grep -oE '[^>]*(feeds|train-search|X-Train|api/)[^<]*' root.html | head -20
          echo
          echo "=== any token/key constants ==="
          grep -oE '(token|key|auth|app)[^,;]{0,80}' root.html | head -20
          echo
          echo "=== raw head of root.html ==="
          head -c 3000 root.html
