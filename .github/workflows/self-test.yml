name: self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe proxy endpoints
        run: |
          set -e
          BASE="https://dokorail-proxy.vercel.app"
          echo "== root HTML =="
          curl -sS -m 20 -o root.html -w "http %{http_code}, %{size_download} bytes, %{time_total}s\n" "$BASE/"
          grep -o '/rail/geometry/sha256/[a-f0-9]\{64\}\.json' root.html | head -1
          echo
          echo "== live feed JR-East =="
          curl -sS -m 20 -o feed.json -w "http %{http_code}, %{size_download} bytes, %{time_total}s\n" \
            "$BASE/api/feeds?kind=train&operators=JR-East&known=%7B%7D"
          head -c 200 feed.json; echo
          echo
          echo "== timetable index =="
          curl -sS -m 30 -o tt.json -w "http %{http_code}, %{size_download} bytes, %{time_total}s\n" \
            "$BASE/rail/timetables/startup-v3-index.json"
          echo
          echo "== geometry catalog =="
          GEO=$(grep -o '/rail/geometry/sha256/[a-f0-9]\{64\}\.json' root.html | head -1)
          if [ -n "$GEO" ]; then
            curl -sS -m 30 -o geo.json -w "http %{http_code}, %{size_download} bytes, %{time_total}s\n" "$BASE$GEO"
          else
            echo "(no geometry hash found)"
          fi
