name: self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe proxy endpoints
        run: |
          set -e
          BASE="https://dokorail-proxy.vercel.app"
          echo "== root HTML =="
          curl -sS -m 20 -o root.html -w "http %{http_code}, %{size_download} bytes\n" "$BASE/"
          echo
          echo "== live feed JR-East =="
          curl -sS -m 20 -o feed.json -w "http %{http_code}, %{size_download} bytes\n" \
            "$BASE/api/feeds?kind=train&operators=JR-East&known=%7B%7D"
          head -c 300 feed.json; echo
          echo
          echo "== timetable index =="
          curl -sS -m 30 -o tt.json -w "http %{http_code}, %{size_download} bytes\n" \
            "$BASE/rail/timetables/startup-v3-index.json"
